name = "popcorn-log-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# TMDB API Key 与同步密码以 secret 形式配置（仓库内零密钥）：
#   生产：wrangler secret put TMDB_API_KEY
#         wrangler secret put SYNC_PASSWORD   # 手机「设置→云同步」要填的同步密码
#   本地：复制 .dev.vars.example 为 .dev.vars 并填入
[vars]
# 无明文变量

# 云同步存储（Cloudflare R2，免费 10GB、零出口流量费）
# 建桶：wrangler r2 bucket create popcorn-log
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "popcorn-log"
